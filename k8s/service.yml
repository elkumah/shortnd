apiVersion: v1
kind: Service
metadata:
  name: shortnd-api
  namespace: shortnd
  labels:
    app.kubernetes.io/name: shortnd-api
    app.kubernetes.io/part-of: shortnd
spec:
  type: ClusterIP

  selector:
    app: shortnd-api

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
