apiVersion: v1
kind: LimitRange
metadata:
  name: shortnd-limit-range
  namespace: shortnd
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "256Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "1000m"
        memory: "512Mi"
