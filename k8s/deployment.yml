apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortnd-api
  namespace: shortnd
  labels:
    app.kubernetes.io/name: shortnd-api
    app.kubernetes.io/part-of: shortnd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortnd-api
  template:
    metadata:
      labels:
        app: shortnd-api
        app.kubernetes.io/name: shortnd-api
    spec:
      serviceAccountName: shortnd-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: shortnd-api

          image: 825347768470.dkr.ecr.us-east-1.amazonaws.com/shortnd-api:2334111f536a9174a9deb02b4418cdeadeaf258d-1
          imagePullPolicy: Always
          ports:
            - name: http
              protocol: TCP
              containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: "shortnd-postgres.cgr6a2i0gtpz.us-east-1.rds.amazonaws.com"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "shortnd"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_SECRET_ARN
              value: "arn:aws:secretsmanager:us-east-1:825347768470:secret:rds!db-6bbdb8eb-e84d-4e03-b865-446f9e9a6143-LrOKZa"
            - name: BASE_URL
              value: "http://localhost:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
