apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortnd-api
  namespace: shortnd
  labels:
    app.kubernetes.io/name: shortnd-api
    app.kubernetes.io/part-of: shortnd

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shortnd-api

  template:
    metadata:
      labels:
        app: shortnd-api
        app.kubernetes.io/name: shortnd-api

    spec:
      serviceAccountName: shortnd-api

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: shortnd-api
          image: 723732457731.dkr.ecr.us-east-1.amazonaws.com/shortnd-api:22823da004388864e98d1d9872001ea38c3ef1d5-2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              protocol: TCP
              containerPort: 8000

          env:
            - name: POSTGRES_HOST
              value: "shortnd-postgres.cw3qge8w8gtr.us-east-1.rds.amazonaws.com"

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: "shortnd"

            - name: AWS_REGION
              value: "us-east-1"

            - name: AWS_SECRET_ARN
              value: "arn:aws:secretsmanager:us-east-1:723732457731:secret:rds!db-2c238714-2b45-4bd0-9180-9ec165dcf792-FepIRr"

            - name: BASE_URL
              value: "http://localhost:8000"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
