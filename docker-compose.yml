services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortnd_api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BASE_URL= http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - shortnd_network
  postgres:
    image: postgres:16-alpine
    container_name: shortnd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shortnd_network

volumes:
  postgres_data:
networks:
  shortnd_network:
