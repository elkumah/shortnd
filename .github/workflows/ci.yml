name: Shortnd CI

"on":
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linting
        working-directory: api
        run: |
          ruff check .
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit python dependencies
        run: |
          pip-audit -r api/requirements.txt
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: shortnd
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
      POSTGRES_DB: shortnd_test
      BASE_URL: http://localhost:8000

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: shortnd
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: shortnd_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U shortnd -d shortnd_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: api
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: api
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=95 -v

  build:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: shortnd-api:${{ github.sha }}
      - name: Save Docker image digest
        run: |
          docker save shortnd-api:${{ github.sha }} \
            -o shortnd-api.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortnd-api-docker-image
          path: shortnd-api.tar
          retention-days: 1

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: shortnd-api-docker-image
      - name: Load Docker image
        run: |
          docker load -i shortnd-api.tar
      - name: Verify Docker image
        run: |
          docker images
          docker image inspect shortnd-api:${{ github.sha }}

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shortnd-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortnd-api-sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shortnd-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vulnerability-type: os,library
          exit-code: 1
          skip-setup-trivy: true

  publish-image:
    name: Publish Docker image to ECR
    runs-on: ubuntu-latest
    needs: security-scan

    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: shortnd-api
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Download verified Docker image
        uses: actions/download-artifact@v4
        with:
          name: shortnd-api-docker-image
          path: .

      - name: Load Docker image
        run: docker load --input shortnd-api.tar

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag verified image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag shortnd-api:${{ github.sha }} \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
