name: Shortnd CI

"on":
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linting
        working-directory: api
        run: |
          ruff check .
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: shortnd
      POSTGRES_PASSWORD: shortnd
      POSTGRES_DB: shortnd_test
      BASE_URL: http://localhost:8000

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: shortnd
          POSTGRES_PASSWORD: shortnd
          POSTGRES_DB: shortnd_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U shortnd -d shortnd_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: api
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: api
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=95 -v

  build:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: shortnd-api:${{ github.sha }}
